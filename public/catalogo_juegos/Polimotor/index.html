<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<title>Polimotor</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
			background: #f7fbff;
		}
		.box {
			text-align: center;
			padding: 32px;
		}
		h1 { margin: 0 0 24px; color: #1a237e; }
		a {
			display: block;
			margin: 12px auto;
			max-width: 420px;
			padding: 18px 24px;
			border-radius: 16px;
			text-decoration: none;
			font-size: 22px;
			font-weight: bold;
			color: #111;
			border: 3px solid #fff;
		}
		a.rompecabezas { background: #ffd54f; }
		a.reconocimiento { background: #81d4fa; }
	</style>
</head>
<body>
	<div class="box">
		<h1>Polimotor</h1>
		<a class="rompecabezas" href="Rompecabezas/">Rompecabezas del cuerpo</a>
		<a class="reconocimiento" href="Reconocimiento/">Reconocimiento de partes</a>
	</div>

	<div style="display: none; background-color: rgba(255, 255, 255, 0.664); width: 100%; height: 100%; position: fixed; z-index: 100;" id="fondo_blanco"></div>

	<div style="display: none; text-align: center;" id="final" class="final">
		<h1 style="font-size: 25pt; padding-top: 326pt; padding-bottom: 0px;" class="borde2" id="texto_final"></h1>
		<hr>
		<div class="row">
			<div class="col-12" style="padding-bottom: 0pt; margin-top: 0px;">
				<h1 style="font-size: 25pt; padding: 12px;" class="borde2">¿Quieres jugar nuevamente?</h1>
			</div>
			<div class="col-3"></div>
			<div class="col-3 text-center">
				<button style="width: 80%; height: 50px !important; border-radius: 20pt; font-size: 23px;" onclick="window.location.reload(1)" class="btn btn-success">Si, jugar</button>
			</div>
			<div class="col-3 text-center">
				<button style="width: 80%; height: 50px !important; border-radius: 20pt; font-size: 23px;" onclick="history.back()" class="btn btn-danger">No, salir</button>
			</div>
			<div class="col-3"></div>
		</div>
	</div>

	<div id="principal">
		<div class="hud-top">
			<div class="hud-nav">
				<div id="progreso" class="hud-progreso" hidden></div>
				<button type="button" id="btn-ver" class="btn btn-success btn-round" title="Pista" hidden><i class="fa-solid fa-eye"></i></button>
				<button onclick="location.reload()" class="btn btn-warning btn-round"><i class="fa-solid fa-rotate"></i></button>
				<button onclick="history.back()" class="btn btn-danger btn-round"><i class="fa-solid fa-arrow-left"></i></button>
			</div>
		</div>

		<div class="escenario" id="escenario" style="padding-top: 15px;">
			<div class="lienzo-wrap">
				<div id="lienzo">
					<img id="img-silueta" alt="Silueta guía" hidden>
					<img id="img-completo" alt="Figura completa" hidden>
					<div id="zonas"></div>
					<div id="piezas-colocadas"></div>
				</div>
			</div>
			<div id="bandeja" class="bandeja"></div>
			<div id="referencia-completa" class="referencia-completa" hidden>
				<img id="referencia-img" alt="Figura de ayuda">
			</div>
		</div>
	</div>

	<div id="zoom-pieza" class="zoom-pieza" hidden></div>

	<div id="menu-acc" class="menu-acc">
		<button type="button" id="btn-menu-acc" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-acc-panel" title="Accesibilidad">
			<i class="fa-solid fa-universal-access"></i>
		</button>
		<div id="menu-acc-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Accesibilidad</strong>
				<button type="button" id="btn-cerrar-acc" class="menu-acc-cerrar" aria-label="Cerrar">×</button>
			</div>
			<div id="menu-acc-ops" class="menu-acc-ops"></div>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
