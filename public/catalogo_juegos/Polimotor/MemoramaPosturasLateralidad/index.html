<body class="esperando-inicio">
	<!-- Fondo: un gimnasio deportivo infantil (pared calida con fotos del mural, espalderas, canasta de
	     baloncesto, colchonetas y piso de madera). Animaciones suaves y solo a los lados del mural. -->
	<div class="gim-fondo" aria-hidden="true">
		<svg class="gim-sala" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="gim-pared" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#cfe9fb"/>
					<stop offset=".62" stop-color="#ffe8cc"/>
					<stop offset="1" stop-color="#ffd8a8"/>
				</linearGradient>
				<radialGradient id="gim-luz" cx=".5" cy=".36" r=".58">
					<stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/>
					<stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
				</radialGradient>
				<linearGradient id="gim-piso" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#e8a765"/>
					<stop offset="1" stop-color="#cf8a46"/>
				</linearGradient>
				<g id="gim-balon">
					<circle r="30" fill="#ff922b"/>
					<g fill="none" stroke="#ffffff" stroke-width="4">
						<circle r="30"/>
						<path d="M-30,0 H30 M0,-30 V30"/>
						<path d="M-30,-16 Q0,0 -30,16"/>
						<path d="M30,-16 Q0,0 30,16"/>
					</g>
				</g>
			</defs>
			<rect width="1600" height="900" fill="url(#gim-pared)"/>
			<ellipse cx="800" cy="350" rx="740" ry="430" fill="url(#gim-luz)"/>

			<!-- piso de madera con lineas de cancha -->
			<rect y="760" width="1600" height="12" fill="#ffffff" opacity=".6"/>
			<rect y="772" width="1600" height="128" fill="url(#gim-piso)"/>
			<g stroke="#fff3bf" stroke-width="5" opacity=".5">
				<path d="M0,820 H1600"/>
				<path d="M140,772 V900 M380,772 V900 M1220,772 V900 M1460,772 V900"/>
			</g>

			<!-- colchonetas apiladas a los lados -->
			<g>
				<rect x="60" y="742" width="250" height="46" rx="16" fill="#4dabf7" stroke="#1c7ed6" stroke-width="5"/>
				<rect x="60" y="704" width="250" height="42" rx="16" fill="#69db7c" stroke="#2f9e44" stroke-width="5"/>
				<rect x="1290" y="742" width="250" height="46" rx="16" fill="#ffa8a8" stroke="#e03131" stroke-width="5"/>
				<rect x="1290" y="704" width="250" height="42" rx="16" fill="#ffd43b" stroke="#e8a200" stroke-width="5"/>
			</g>

			<!-- espaldera de gimnasia (izquierda) -->
			<g stroke="#b5762f" stroke-width="12" stroke-linecap="round">
				<path d="M72,180 V700 M276,180 V700"/>
				<path d="M72,230 H276 M72,300 H276 M72,370 H276 M72,440 H276 M72,510 H276 M72,580 H276 M72,650 H276"/>
			</g>

			<!-- canasta de baloncesto (derecha) -->
			<g>
				<rect x="1330" y="150" width="210" height="150" rx="12" fill="#ffffff" stroke="#1c7ed6" stroke-width="10"/>
				<rect x="1388" y="212" width="95" height="70" fill="none" stroke="#e03131" stroke-width="9"/>
				<rect x="1392" y="296" width="88" height="12" rx="6" fill="#fa5252"/>
				<path d="M1396,308 L1406,360 H1466 L1476,308" fill="none" stroke="#ced4da" stroke-width="5"/>
				<path d="M1412,308 V356 M1436,308 V362 M1460,308 V356" fill="none" stroke="#ced4da" stroke-width="4"/>
			</g>

			<!-- fotos deportivas pegadas en la pared, a los lados del mural -->
			<g class="gim-fotos">
				<g class="gim-foto" style="--i:0" transform="translate(372 258) rotate(-6)">
					<rect x="-54" y="-66" width="108" height="132" rx="8" fill="#ffffff" stroke="#f06595" stroke-width="7"/>
					<rect x="-40" y="-52" width="80" height="86" rx="6" fill="#ffe3ec"/>
					<circle cx="0" cy="-22" r="15" fill="#f2c6b9"/>
					<path d="M-16,8 Q0,-8 16,8 L12,30 H-12 Z" fill="#e1709c"/>
				</g>
				<g class="gim-foto" style="--i:1" transform="translate(316 472) rotate(7)">
					<rect x="-54" y="-66" width="108" height="132" rx="8" fill="#ffffff" stroke="#4dabf7" stroke-width="7"/>
					<rect x="-40" y="-52" width="80" height="86" rx="6" fill="#e3f4ff"/>
					<circle cx="0" cy="-22" r="15" fill="#f2c6b9"/>
					<path d="M-16,8 Q0,-8 16,8 L12,30 H-12 Z" fill="#2b896f"/>
				</g>
				<g class="gim-foto" style="--i:2" transform="translate(1238 266) rotate(8)">
					<rect x="-54" y="-66" width="108" height="132" rx="8" fill="#ffffff" stroke="#40c057" stroke-width="7"/>
					<rect x="-40" y="-52" width="80" height="86" rx="6" fill="#e8fbea"/>
					<circle cx="0" cy="-22" r="15" fill="#f2c6b9"/>
					<path d="M-16,8 Q0,-8 16,8 L12,30 H-12 Z" fill="#e1709c"/>
				</g>
				<g class="gim-foto" style="--i:3" transform="translate(1292 486) rotate(-7)">
					<rect x="-54" y="-66" width="108" height="132" rx="8" fill="#ffffff" stroke="#fab005" stroke-width="7"/>
					<rect x="-40" y="-52" width="80" height="86" rx="6" fill="#fff6dc"/>
					<circle cx="0" cy="-22" r="15" fill="#f2c6b9"/>
					<path d="M-16,8 Q0,-8 16,8 L12,30 H-12 Z" fill="#2b896f"/>
				</g>
			</g>

			<!-- banderines del gimnasio -->
			<g class="gim-banderines">
				<path d="M-10,34 Q400,104 800,50 Q1200,0 1610,60" fill="none" stroke="#1c7ed6" stroke-width="4" opacity=".5"/>
				<path class="gim-banderin" style="--i:0" d="M110,56 h40 l-20,42 z" fill="#ff8cc6"/>
				<path class="gim-banderin" style="--i:1" d="M270,80 h40 l-20,42 z" fill="#ffd43b"/>
				<path class="gim-banderin" style="--i:2" d="M430,90 h40 l-20,42 z" fill="#74c0fc"/>
				<path class="gim-banderin" style="--i:3" d="M590,84 h40 l-20,42 z" fill="#8ce99a"/>
				<path class="gim-banderin" style="--i:4" d="M1010,28 h40 l-20,42 z" fill="#ffa94d"/>
				<path class="gim-banderin" style="--i:5" d="M1170,22 h40 l-20,42 z" fill="#ff8cc6"/>
				<path class="gim-banderin" style="--i:6" d="M1330,32 h40 l-20,42 z" fill="#b197fc"/>
				<path class="gim-banderin" style="--i:7" d="M1490,50 h40 l-20,42 z" fill="#ffd43b"/>
			</g>

			<!-- balones que botan despacio -->
			<use href="#gim-balon" class="gim-bota" style="--i:0" transform="translate(436 700)"/>
			<use href="#gim-balon" class="gim-bota" style="--i:1" transform="translate(1176 712) scale(.85)"/>
		</svg>
	</div>

	<div id="pantalla-inicio" class="pantalla-inicio">
		<button type="button" id="btn-inicio-volver" class="inicio-volver" hidden>
			<img src="../../../assets/images/selector-aula/volver.png" alt="Volver">
		</button>
		<div class="inicio-mancha" aria-hidden="true"></div>
		<div class="inicio-contenido">
			<img class="inicio-icono" src="memorama-posturas.png" alt="" aria-hidden="true">
			<p class="inicio-kicker">Memorama de Posturas Asimétricas y Lateralidad</p>
			<button type="button" id="btn-empecemos" class="btn-empecemos">
				<span class="btn-empecemos-anillo" aria-hidden="true"></span>
				<span class="btn-empecemos-anillo btn-empecemos-anillo-2" aria-hidden="true"></span>
				<span class="btn-empecemos-texto">¡Empecemos!</span>
			</button>
		</div>
	</div>

	<div id="intro3d-root" hidden>
		<div id="three-container"></div>
		<div id="phaser-container"></div>
		<button type="button" id="btn-omitir-intro3d" class="btn btn-warning" style="position:absolute;z-index:5;top:18px;left:18px;width:auto;padding:6pt 10pt;border-radius:8pt;font-size:24px;color:#000;">
			Omitir <i class="fa fa-forward" aria-hidden="true"></i>
		</button>
		<div id="intro3d-continuar" hidden>
			<div class="intro3d-continuar-card">
				<div class="intro3d-titulo-wrap">
					<span class="intro3d-ray intro3d-ray-l1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l3" aria-hidden="true"></span>
					<h2>¡Listo!</h2>
					<span class="intro3d-ray intro3d-ray-r1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r3" aria-hidden="true"></span>
				</div>
				<p>Toca el botón para empezar el juego</p>
				<div class="intro3d-btn-wrap">
					<span class="intro3d-ray intro3d-ray-bl1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-bl2" aria-hidden="true"></span>
					<button type="button" id="btn-continuar-intro3d">
						<span class="intro3d-btn-shine" aria-hidden="true"></span>
						<span class="intro3d-play" aria-hidden="true"></span>
						<span>CONTINUAR</span>
					</button>
					<span class="intro3d-ray intro3d-ray-br1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-br2" aria-hidden="true"></span>
				</div>
			</div>
		</div>
	</div>

	<div style="display: none; background-color: rgba(255, 255, 255, 0.664); width: 100%; height: 100%; position: fixed; z-index: 100;" id="fondo_blanco"></div>

	<div id="final" class="final" hidden>
		<div id="victoria">
			<img src="../../img/fondo.png" class="fondo" alt="">
			<div class="contenido">
				<img src="../../img/excelente.png" class="excelente" alt="¡Excelente!">
				<p class="texto-final" id="texto_final"></p>
				<img src="../../img/trofeo.png" class="trofeo" alt="Trofeo">
				<img src="../../img/zeus_normal.gif" class="personaje zeus" alt="Zeus">
				<img src="../../img/zoe_normal.gif" class="personaje zoe" alt="Zoe">
				<div class="destello destello-1"></div>
				<div class="destello destello-2"></div>
				<div class="destello destello-3"></div>
			</div>
			<img src="../../img/cortina_izq.png" class="cortina cortina-izq" alt="">
			<img src="../../img/cortina_der.png" class="cortina cortina-der" alt="">
			<div class="confeti" id="confeti"></div>
		</div>
		<div class="final-acciones" id="final-acciones">
			<p class="final-pregunta">¿Quieres jugar nuevamente?</p>
			<div class="final-botones">
				<button type="button" class="btn btn-success" onclick="window.location.reload(1)"><i class="fa-solid fa-play"></i> Sí</button>
				<button type="button" class="btn btn-danger" onclick="history.back()"><i class="fa-solid fa-home"></i> No</button>
			</div>
		</div>
	</div>

	<div id="principal">
		<!-- Zona superior: inicio, reiniciar, edad y título. -->
		<header class="hud-top">
			<div class="hud-nav">
				<button type="button" onclick="history.back()" class="btn-inicio" title="Volver al inicio"><i class="fa-solid fa-house" aria-hidden="true"></i> Inicio</button>
				<button type="button" onclick="location.reload()" class="btn btn-warning btn-round" title="Reiniciar"><i class="fa-solid fa-rotate"></i></button>
			</div>
			<div class="hud-titulo">
				<h1 aria-label="Memorama de posturas"><span style="--c:#ff6b6b">M</span><span style="--c:#ff922b">E</span><span style="--c:#fab005">M</span><span style="--c:#40c057">O</span><span style="--c:#15aabf">R</span><span style="--c:#4c6ef5">A</span><span style="--c:#7950f2">M</span><span style="--c:#be4bdb">A</span><span class="hud-espacio"> </span><span style="--c:#f06595">D</span><span style="--c:#ff6b6b">E</span><span class="hud-espacio"> </span><span style="--c:#ff922b">P</span><span style="--c:#fab005">O</span><span style="--c:#40c057">S</span><span style="--c:#15aabf">T</span><span style="--c:#4c6ef5">U</span><span style="--c:#7950f2">R</span><span style="--c:#be4bdb">A</span><span style="--c:#f06595">S</span></h1>
			</div>
		</header>

		<!-- Zona central: el tablero mágico de corcho (Phaser) con las cuatro tarjetas en 2 × 2. -->
		<main class="escena">
			<div id="escenario-zona" class="escenario-zona">
				<div id="escenario-phaser" class="escenario-phaser" role="application" aria-label="Mural con ocho tarjetas boca abajo. Toca dos tarjetas para voltearlas y busca las que muestran exactamente la misma postura y del mismo lado."></div>
				<div id="escenario-cartel" class="escenario-cartel" hidden>
					<strong id="escenario-cartel-titulo"></strong>
					<span id="escenario-cartel-sub"></span>
				</div>
			</div>
		</main>

		<!-- Zona inferior: parejas encontradas (un espacio por pareja que se llena con su dibujo). -->
		<footer class="barra-abajo">
			<div id="progreso-box" class="progreso-box" aria-live="polite">
				<span id="progreso-ronda" class="progreso-ronda">RONDA 1/4</span>
				<p id="aviso-abajo" class="aviso-abajo" hidden></p>
				<p class="progreso-texto"><span id="progreso-rotulo">PAREJAS ENCONTRADAS:</span> <strong id="progreso-num">0/4</strong></p>
				<div id="progreso-ranuras" class="progreso-ranuras"></div>
			</div>
		</footer>
	</div>

	<!-- Zeus (3D): solo en la presentación y la demostración, de pie a la izquierda de las tarjetas; su nube va
	     sobre su cabeza. Durante la partida no está en la escena. -->
	<aside id="guia" class="guia" aria-live="polite">
		<div class="guia-pj">
			<img id="guia-img" src="../../img/zeus_normal.gif" alt="">
			<div id="zeus-nube" class="zeus-nube" aria-live="polite" hidden><span id="zeus-nube-texto"></span></div>
		</div>
	</aside>

	<!-- Felicitación del final: ¡LO LOGRASTE! con "Volver a jugar" y "Continuar". -->
	<div id="felicitacion" class="felicitacion" hidden>
		<div class="felicitacion-tarjeta" role="dialog" aria-labelledby="felicitacion-titulo">
			<div class="felicitacion-estrellas" aria-hidden="true">
				<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
			</div>
			<h2 id="felicitacion-titulo">¡RETO COMPLETADO!</h2>
			<p id="felicitacion-sub">Encontraste todas las parejas de posturas.</p>
			<div id="felicitacion-dibujos" class="felicitacion-dibujos" aria-hidden="true"></div>
			<div class="felicitacion-botones">
				<button type="button" id="btn-otra-vez" class="btn-final btn-final-otra"><i class="fa-solid fa-rotate-right"></i> <span>Volver a jugar</span></button>
				<button type="button" id="btn-continuar" class="btn-final btn-final-seguir"><span>Continuar</span> <i class="fa-solid fa-arrow-right"></i></button>
			</div>
		</div>
	</div>

	<div id="comenzar-wrap" class="comenzar-wrap" hidden>
		<button type="button" id="btn-comenzar" class="btn-comenzar"><i class="fa-solid fa-play"></i><span class="btn-comenzar-texto">¡COMENZAR!</span></button>
	</div>

	<div id="menu-acc" class="menu-acc">
		<button type="button" id="btn-menu-acc" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-acc-panel" title="Accesibilidad">
			<i class="fa-solid fa-universal-access"></i>
		</button>
		<div id="menu-acc-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Accesibilidad</strong>
				<button type="button" id="btn-cerrar-acc" class="menu-acc-cerrar" aria-label="Cerrar">&times;</button>
			</div>
			<div id="menu-acc-ops" class="menu-acc-ops"></div>
		</div>
	</div>

	<div id="menu-vol" class="menu-acc">
		<button type="button" id="btn-menu-vol" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-vol-panel" title="Sonido">
			<i class="fa-solid fa-volume-high"></i>
		</button>
		<div id="menu-vol-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Sonido</strong>
				<button type="button" id="btn-cerrar-vol" class="menu-acc-cerrar" aria-label="Cerrar">×</button>
			</div>
			<label class="menu-acc-op">
				<input type="checkbox" id="chk-voces" checked> Voces
			</label>
			<label class="menu-acc-op">
				<input type="checkbox" id="chk-efectos" checked> Efectos
			</label>
			<label class="menu-acc-op menu-acc-rango">
				<span>Música de fondo <strong id="vol-val">20</strong></span>
				<input type="range" id="rango-volumen" min="0" max="100" step="1" value="20">
			</label>
		</div>
	</div>
