<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<title>Memoria corporal</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="stylesheet" href="/assets/css/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="/assets/css/fonts.css">
	<link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
	<script src="/assets/js/jquery-4.0.0.min.js"></script>
	<script src="/assets/js/sweetalert.js"></script>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="../../final/final.css">
	<link rel="stylesheet" href="../../intro3d/css/intro.css">
</head>
<body class="esperando-inicio">
	<div id="pantalla-inicio" class="pantalla-inicio">
		<div class="inicio-mancha" aria-hidden="true"></div>
		<div class="inicio-contenido">
			<p class="inicio-kicker">Memoria corporal</p>
			<button type="button" id="btn-empecemos" class="btn-empecemos">
				<span class="btn-empecemos-anillo" aria-hidden="true"></span>
				<span class="btn-empecemos-anillo btn-empecemos-anillo-2" aria-hidden="true"></span>
				<span class="btn-empecemos-texto">¡Empecemos!</span>
			</button>
			<p class="inicio-ayuda">Toca para comenzar la intro</p>
		</div>
	</div>

	<div id="intro3d-root" hidden>
		<div id="three-container"></div>
		<div id="phaser-container"></div>
		<button type="button" id="btn-omitir-intro3d" class="btn btn-warning" style="position:absolute;z-index:5;top:18px;left:18px;width:auto;padding:6pt 10pt;border-radius:8pt;font-size:24px;color:#000;">
			Omitir <i class="fa fa-forward" aria-hidden="true"></i>
		</button>
		<div id="intro3d-continuar" hidden>
			<div class="intro3d-continuar-card">
				<div class="intro3d-titulo-wrap">
					<span class="intro3d-ray intro3d-ray-l1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l3" aria-hidden="true"></span>
					<h2>¡Listo!</h2>
					<span class="intro3d-ray intro3d-ray-r1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r3" aria-hidden="true"></span>
				</div>
				<p>Toca el botón para empezar el juego</p>
				<div class="intro3d-btn-wrap">
					<span class="intro3d-ray intro3d-ray-bl1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-bl2" aria-hidden="true"></span>
					<button type="button" id="btn-continuar-intro3d">
						<span class="intro3d-btn-shine" aria-hidden="true"></span>
						<span class="intro3d-play" aria-hidden="true"></span>
						<span>CONTINUAR</span>
					</button>
					<span class="intro3d-ray intro3d-ray-br1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-br2" aria-hidden="true"></span>
				</div>
			</div>
		</div>
	</div>

<div style="display: none; background-color: rgba(255, 255, 255, 0.664); width: 100%; height: 100%; position: fixed; z-index: 100;" id="fondo_blanco"></div>

	<div id="final" class="final" hidden>
		<div id="victoria">
			<img src="../../img/fondo.png" class="fondo" alt="">
			<div class="contenido">
				<img src="../../img/excelente.png" class="excelente" alt="¡Excelente!">
				<p class="texto-final" id="texto_final"></p>
				<img src="../../img/trofeo.png" class="trofeo" alt="Trofeo">
				<img src="../../img/zeus_normal.gif" class="personaje zeus" alt="Zeus">
				<img src="../../img/zoe_normal.gif" class="personaje zoe" alt="Zoe">
				<div class="destello destello-1"></div>
				<div class="destello destello-2"></div>
				<div class="destello destello-3"></div>
			</div>
			<img src="../../img/cortina_izq.png" class="cortina cortina-izq" alt="">
			<img src="../../img/cortina_der.png" class="cortina cortina-der" alt="">
			<div class="confeti" id="confeti"></div>
		</div>
		<div class="final-acciones" id="final-acciones">
			<p class="final-pregunta">¿Quieres jugar nuevamente?</p>
			<div class="final-botones">
				<button type="button" class="btn btn-success" onclick="window.location.reload(1)"><i class="fa-solid fa-play"></i> Sí</button>
				<button type="button" class="btn btn-danger" onclick="history.back()"><i class="fa-solid fa-home"></i> No</button>
			</div>
		</div>
	</div>

<div id="principal">
		<div class="hud-top">
			<div class="hud-nav">
				<div id="progreso" class="hud-progreso" hidden></div>
				<button type="button" id="btn-ver" class="btn btn-success btn-round" title="Ver de nuevo" hidden><i class="fa-solid fa-eye"></i></button>
				<button onclick="location.reload()" class="btn btn-warning btn-round"><i class="fa-solid fa-rotate"></i></button>
				<button onclick="history.back()" class="btn btn-danger btn-round"><i class="fa-solid fa-arrow-left"></i></button>
			</div>
		</div>

		<div class="escenario escenario-memoria" id="escenario">
			<div class="memoria-bloque">
				<p class="enunciado borde" id="enunciado"></p>
				<div id="cuenta" class="cuenta" hidden></div>
				<div id="secuencia" class="secuencia" hidden></div>
				<div id="opciones" class="opciones"></div>
			</div>
		</div>
	</div>

	<div id="menu-acc" class="menu-acc">
		<button type="button" id="btn-menu-acc" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-acc-panel" title="Accesibilidad">
			<i class="fa-solid fa-universal-access"></i>
		</button>
		<div id="menu-acc-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Accesibilidad</strong>
				<button type="button" id="btn-cerrar-acc" class="menu-acc-cerrar" aria-label="Cerrar">&times;</button>
			</div>
			<div id="menu-acc-ops" class="menu-acc-ops"></div>
		</div>
	</div>

	<div id="menu-vol" class="menu-acc">
		<button type="button" id="btn-menu-vol" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-vol-panel" title="Volumen de fondo">
			<i class="fa-solid fa-volume-high"></i>
		</button>
		<div id="menu-vol-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Volumen de fondo</strong>
				<button type="button" id="btn-cerrar-vol" class="menu-acc-cerrar" aria-label="Cerrar">×</button>
			</div>
			<label class="menu-acc-op menu-acc-rango">
				<span>Volumen <strong id="vol-val">20</strong></span>
				<input type="range" id="rango-volumen" min="0" max="100" step="1" value="20">
			</label>
		</div>
	</div>
	<script src="../../texto_voz.js"></script>
	<script src="../../shared/edad-nivel.js"></script>
	<script src="../../../assets/vendor/phaser/phaser.min.js"></script>
	<script src="../../intro3d/js/config.js"></script>
	<script type="importmap">
	{
	  "imports": {
	    "three": "../../../assets/vendor/three/three.module.js",
	    "three/addons/": "../../../assets/vendor/three/addons/"
	  }
	}
	</script>
	<script type="module" src="../../intro3d/js/three-scene.js"></script>
	<script type="module" src="../../intro3d/js/final-scene.js"></script>
	<script src="../../intro3d/js/intro.js"></script>
	<script src="../../final/final.js"></script>
	<script src="script.js"></script>
</body>
</html>
