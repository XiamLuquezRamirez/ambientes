<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<title>El Circuito Láser de la Central de Energía</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="stylesheet" href="../../../assets/css/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="../../../assets/css/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="../../../assets/css/fonts.css">
	<link rel="stylesheet" href="../../../assets/css/sweetalert2.min.css">
	<script src="../../../assets/js/jquery-4.0.0.min.js"></script>
	<script src="../../../assets/js/sweetalert.js"></script>
	<link rel="stylesheet" href="style.css?v=20261118b">
	<link rel="stylesheet" href="../comun/inicio-fondo.css?v=20261030d">
	<link rel="stylesheet" href="../comun/interfaz.css?v=20261022o">
	<script src="../comun/inicio-fondo.js?v=20261030d"></script>
	<script src="../comun/inicio-puertas.js?v=20261125h" data-transicion="acercamiento"></script>
	<script src="../comun/volumen.js?v=20261123vol6"></script>
	<script src="../comun/omitir-demo.js?v=20261127c"></script>
	<link rel="stylesheet" href="../../intro3d/css/intro.css">
	<link rel="stylesheet" href="../../tutorial/tutorial.css?v=20261005a">
	<link rel="stylesheet" href="../comun/inicio-puertas.css?v=20261125h">
</head>
<body class="esperando-inicio">
	<!-- La central de energía, el circuito, los láseres, el reactor y la esfera: un solo lienzo Phaser a pantalla completa, detrás de la interfaz. -->
	<div id="escenario-phaser" class="escenario-phaser" role="application" aria-label="Central de energía: pon el dedo sobre la esfera de luz y llévala por el carril hasta el reactor; espera a que los láseres rojos se apaguen para pasar."></div>

	<div id="pantalla-inicio" class="pantalla-inicio">
		<button type="button" id="btn-inicio-volver" class="inicio-volver" hidden>
			<img src="../../../assets/images/selector-aula/volver.png" alt="Volver">
		</button>
		<div class="inicio-mancha" aria-hidden="true"></div>
		<div class="inicio-contenido">
			<img class="inicio-icono" src="circuito-laser.png" alt="" aria-hidden="true">
			<p class="inicio-kicker">El Circuito Láser de la Central de Energía</p>
			<button type="button" id="btn-empecemos" class="btn-empecemos">
				<span class="btn-empecemos-anillo" aria-hidden="true"></span>
				<span class="btn-empecemos-anillo btn-empecemos-anillo-2" aria-hidden="true"></span>
				<span class="btn-empecemos-texto">¡Empecemos!</span>
			</button>
		</div>
	</div>

	<div id="intro3d-root" hidden>
		<div id="three-container"></div>
		<div id="phaser-container"></div>
		<button type="button" id="btn-omitir-intro3d" class="btn btn-warning" style="position:absolute;z-index:5;top:18px;left:18px;width:auto;padding:6pt 10pt;border-radius:8pt;font-size:24px;color:#000;">
			Omitir <i class="fa fa-forward" aria-hidden="true"></i>
		</button>
		<div id="intro3d-continuar" hidden>
			<div class="intro3d-continuar-card">
				<div class="intro3d-titulo-wrap">
					<span class="intro3d-ray intro3d-ray-l1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l3" aria-hidden="true"></span>
					<h2>¡Listo!</h2>
					<span class="intro3d-ray intro3d-ray-r1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r3" aria-hidden="true"></span>
				</div>
				<p>Toca el botón para empezar el juego</p>
				<div class="intro3d-btn-wrap">
					<span class="intro3d-ray intro3d-ray-bl1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-bl2" aria-hidden="true"></span>
					<button type="button" id="btn-continuar-intro3d">
						<span class="intro3d-btn-shine" aria-hidden="true"></span>
						<span class="intro3d-play" aria-hidden="true"></span>
						<span>CONTINUAR</span>
					</button>
					<span class="intro3d-ray intro3d-ray-br1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-br2" aria-hidden="true"></span>
				</div>
			</div>
		</div>
	</div>

	<div style="display: none; background-color: rgba(255, 255, 255, 0.664); width: 100%; height: 100%; position: fixed; z-index: 100;" id="fondo_blanco"></div>

	<div id="principal">
		<!-- Arriba: título centrado; reiniciar y volver a la derecha. -->
		<header class="hud-top">
			<div class="hud-hueco"></div>
			<div class="hud-titulo">
				<h1 aria-label="¡El Circuito Láser! La central de energía"><span class="hud-titulo-pre">La central de energía</span><span class="hud-titulo-linea"><span style="--c:#facc15">¡</span><span style="--c:#f472b6">E</span><span style="--c:#fb923c">L</span><span class="hud-espacio"> </span><span style="--c:#facc15">C</span><span style="--c:#4ade80">I</span><span style="--c:#22d3ee">R</span><span style="--c:#60a5fa">C</span><span style="--c:#a78bfa">U</span><span style="--c:#f472b6">I</span><span style="--c:#fb923c">T</span><span style="--c:#facc15">O</span><span class="hud-espacio"> </span><span style="--c:#4ade80">L</span><span style="--c:#22d3ee">Á</span><span style="--c:#60a5fa">S</span><span style="--c:#a78bfa">E</span><span style="--c:#f472b6">R</span><span style="--c:#fb923c">!</span></span></h1>
			</div>
			<div class="hud-nav hud-nav-der">
				<button type="button" onclick="location.reload()" class="btn btn-warning btn-round btn-recargar" title="Reiniciar"><i class="fa-solid fa-rotate"></i></button>
				<button type="button" onclick="history.back()" class="btn btn-danger btn-round" title="Salir"><i class="fa-solid fa-arrow-left"></i></button>
			</div>
		</header>

		<main class="escena">
			<div id="escenario-zona" class="escenario-zona">
				<div id="escenario-cartel" class="escenario-cartel" hidden>
					<strong id="escenario-cartel-titulo"></strong>
					<span id="escenario-cartel-sub"></span>
				</div>
			</div>
		</main>
	</div>

	<!-- Indicador de nivel (abajo a la izquierda): un rayo por circuito, con el avance del circuito actual. -->
	<nav id="nivel" class="nivel" aria-live="polite" aria-label="Nivel 1 de 3">
		<span id="nivel-rotulo" class="nivel-rotulo">NIVEL 1 DE 3</span>
		<ol class="nivel-pasos">
			<li class="nivel-paso"><i class="fa-solid fa-bolt" aria-hidden="true"></i><b>1</b></li>
			<li class="nivel-flecha" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></li>
			<li class="nivel-paso"><i class="fa-solid fa-bolt" aria-hidden="true"></i><b>2</b></li>
			<li class="nivel-flecha" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></li>
			<li class="nivel-paso"><i class="fa-solid fa-bolt" aria-hidden="true"></i><b>3</b></li>
		</ol>
	</nav>

	<!-- Zoe (3D): presentación, demo y final, abajo a la izquierda. -->
	<aside id="guia" class="guia" aria-live="polite">
		<div class="guia-pj">
			<img id="guia-img" src="../../img/zoe_normal.gif" alt="">
			<div id="zoe-nube" class="zoe-nube" aria-live="polite" hidden><span id="zoe-nube-texto"></span></div>
		</div>
	</aside>

	<div id="comenzar-wrap" class="comenzar-wrap" hidden>
		<button type="button" id="btn-comenzar" class="btn-comenzar"><i class="fa-solid fa-play"></i><span class="btn-comenzar-texto">¡Comenzar a jugar!</span></button>
	</div>

	<!-- Pantalla final: nivel completado, progreso y la miniatura de cada circuito superado. -->
	<div id="resumen" class="resumen" hidden>
		<div class="resumen-tarjeta" role="dialog" aria-labelledby="resumen-titulo">
			<div class="resumen-estrellas" aria-hidden="true">
				<i class="fa-solid fa-bolt" style="--m:#22d3ee"></i><i class="fa-solid fa-trophy" style="--m:#facc15"></i><i class="fa-solid fa-bolt" style="--m:#a78bfa"></i>
			</div>
			<h2 id="resumen-titulo">¡NIVEL COMPLETADO!</h2>
			<p class="resumen-sub">Tres circuitos superados: la central brilla gracias a ti</p>
			<div class="resumen-progreso">
				<div id="resumen-barra" class="resumen-barra" role="progressbar" aria-label="Circuitos superados"><span></span></div>
				<strong id="resumen-cuenta">3 de 3 circuitos</strong>
			</div>
			<ol id="resumen-lista" class="resumen-lista"></ol>
			<div class="resumen-botones">
				<button type="button" id="btn-otra-vez" class="btn-final btn-final-otra"><i class="fa-solid fa-rotate-right"></i> <span>¡JUGAR OTRA VEZ!</span></button>
				<button type="button" class="btn-final btn-final-menu" onclick="history.back()"><i class="fa-solid fa-arrow-right"></i> <span>CONTINUAR</span></button>
			</div>
		</div>
	</div>

	<!-- Accesibilidad y volumen: abajo a la derecha. -->
	<div id="menu-acc" class="menu-acc">
		<button type="button" id="btn-menu-acc" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-acc-panel" title="Accesibilidad">
			<i class="fa-solid fa-universal-access"></i>
		</button>
		<div id="menu-acc-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Accesibilidad</strong>
				<button type="button" id="btn-cerrar-acc" class="menu-acc-cerrar" aria-label="Cerrar">&times;</button>
			</div>
			<div id="menu-acc-ops" class="menu-acc-ops"></div>
		</div>
	</div>

	<div id="menu-vol" class="menu-acc">
		<button type="button" id="btn-menu-vol" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-vol-panel" title="Música de fondo">
			<i class="fa-solid fa-volume-high"></i>
		</button>
		<div id="menu-vol-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Música de fondo</strong>
				<button type="button" id="btn-cerrar-vol" class="menu-acc-cerrar" aria-label="Cerrar">×</button>
			</div>
			<label class="menu-acc-op menu-acc-rango">
				<span>Volumen <strong id="vol-val">20</strong></span>
				<input type="range" id="rango-volumen" min="0" max="100" step="1" value="20">
			</label>
		</div>
	</div>

	<script src="../../texto_voz.js?v=20261119vol"></script>
	<script src="../../shared/edad-nivel.js"></script>
	<script src="../../../assets/vendor/phaser/phaser.min.js"></script>
	<script src="../../intro3d/js/config.js?v=20261007a"></script>

	{
	  "imports": {
	    "three": "../../../assets/vendor/three/three.module.js",
	    "three/addons/": "../../../assets/vendor/three/addons/"

	</script>
	<script type="module" src="../../intro3d/js/three-scene.js?v=20261105a"></script>
	<script src="../../tutorial/tutorial.js?v=20261019c"></script>
	<script src="../../intro3d/js/intro.js?v=20261028p4"></script>
	<script src="../../shared/aplicar-perfil-juego.js?v=20261013a"></script>
	<script src="../../shared/pin-accesibilidad.js?v=20261019c"></script>
	<script src="../../../assets/vendor/gsap/gsap.min.js"></script>
	<script src="../../../assets/vendor/howler/howler.core.min.js"></script>
	<script src="../../shared/pednia-audio.js?v=20261119vol"></script>
	<script src="../../shared/pednia-fx.js?v=20261107d"></script>
	<script src="reglas.js?v=20261118a"></script>
	<script src="sonidos.js?v=20261120vol2"></script>
	<script src="escenario-phaser.js?v=20261118a"></script>
	<script src="arrastre.js?v=20261118a"></script>
	<script src="demo.js?v=20261118a"></script>
	<script src="script.js?v=20261118d"></script>
	<script type="module" src="guia-3d.js?v=20261118c"></script>
</body>
</html>
