<body class="esperando-inicio">
	<!-- Fondo: el teatro interactivo de PedNia (telones, cenefa, arco de neón con bombillas, guirnaldas, pantalla
	     luminosa y reflectores). La tarima y el foco del piso van en la escena (alineados con Zeus). -->
	<div class="sd-fondo" aria-hidden="true">
		<svg class="sd-teatro" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<linearGradient id="sd-sala" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#2a0f5c"/>
					<stop offset=".55" stop-color="#3b1a7a"/>
					<stop offset="1" stop-color="#1b0a3d"/>
				</linearGradient>
				<linearGradient id="sd-pantalla" x1="0" y1="0" x2="1" y2="1">
					<stop offset="0" stop-color="#4c6ef5"/>
					<stop offset=".5" stop-color="#7048e8"/>
					<stop offset="1" stop-color="#d6336c"/>
				</linearGradient>
				<radialGradient id="sd-pantalla-luz" cx=".5" cy=".55" r=".6">
					<stop offset="0" stop-color="#fff" stop-opacity=".45"/>
					<stop offset="1" stop-color="#fff" stop-opacity="0"/>
				</radialGradient>
				<linearGradient id="sd-telon" x1="0" y1="0" x2="1" y2="0">
					<stop offset="0" stop-color="#7a0b25"/>
					<stop offset=".18" stop-color="#c2183a"/>
					<stop offset=".34" stop-color="#8f0f2c"/>
					<stop offset=".5" stop-color="#d42246"/>
					<stop offset=".68" stop-color="#930f2d"/>
					<stop offset=".84" stop-color="#cc1d40"/>
					<stop offset="1" stop-color="#6d0920"/>
				</linearGradient>
				<linearGradient id="sd-haz-a" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" style="stop-color:var(--haz-a, #fff6bf);stop-opacity:.75"/>
					<stop offset="1" style="stop-color:var(--haz-a, #fff6bf);stop-opacity:0"/>
				</linearGradient>
				<linearGradient id="sd-haz-b" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" style="stop-color:var(--haz-b, #ffd6f0);stop-opacity:.75"/>
					<stop offset="1" style="stop-color:var(--haz-b, #ffd6f0);stop-opacity:0"/>
				</linearGradient>
				<filter id="sd-neon" x="-20%" y="-20%" width="140%" height="140%">
					<feGaussianBlur stdDeviation="6" result="b"/>
					<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
				</filter>
				<path id="sd-estrellita" d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z"/>
			</defs>
			<rect width="1600" height="900" fill="url(#sd-sala)"/>

			<!-- pantalla luminosa del fondo, con puntitos que titilan -->
			<g class="sd-pantalla">
				<rect x="470" y="150" width="660" height="400" rx="34" fill="url(#sd-pantalla)" opacity=".9"/>
				<rect x="470" y="150" width="660" height="400" rx="34" fill="url(#sd-pantalla-luz)"/>
				<g fill="#fff" class="sd-puntos">
					<circle class="sd-punto" style="--i:0" cx="540" cy="200" r="4"/>
					<circle class="sd-punto" style="--i:1" cx="660" cy="240" r="3"/>
					<circle class="sd-punto" style="--i:2" cx="1040" cy="210" r="4"/>
					<circle class="sd-punto" style="--i:3" cx="980" cy="300" r="3"/>
					<circle class="sd-punto" style="--i:4" cx="560" cy="430" r="3"/>
					<circle class="sd-punto" style="--i:5" cx="1080" cy="470" r="4"/>
					<circle class="sd-punto" style="--i:6" cx="720" cy="500" r="3"/>
					<circle class="sd-punto" style="--i:7" cx="880" cy="190" r="3"/>
				</g>
				<rect x="470" y="150" width="660" height="400" rx="34" fill="none" stroke="#ff8ad8" stroke-width="8" filter="url(#sd-neon)" class="sd-neon-borde"/>
			</g>

			<!-- arco de neón con bombillas -->
			<g class="sd-arco">
				<path d="M300,840 L300,250 Q300,90 460,90 L1140,90 Q1300,90 1300,250 L1300,840" fill="none" stroke="#5ce1ff" stroke-width="10" filter="url(#sd-neon)" class="sd-neon-arco"/>
				<g class="sd-bombillas">
					<circle style="--i:0" cx="300" cy="320" r="9"/><circle style="--i:1" cx="300" cy="420" r="9"/>
					<circle style="--i:2" cx="300" cy="520" r="9"/><circle style="--i:3" cx="300" cy="620" r="9"/>
					<circle style="--i:4" cx="300" cy="720" r="9"/><circle style="--i:5" cx="330" cy="170" r="9"/>
					<circle style="--i:6" cx="420" cy="100" r="9"/><circle style="--i:7" cx="540" cy="90" r="9"/>
					<circle style="--i:8" cx="660" cy="90" r="9"/><circle style="--i:9" cx="780" cy="90" r="9"/>
					<circle style="--i:10" cx="900" cy="90" r="9"/><circle style="--i:11" cx="1020" cy="90" r="9"/>
					<circle style="--i:12" cx="1150" cy="92" r="9"/><circle style="--i:13" cx="1260" cy="160" r="9"/>
					<circle style="--i:14" cx="1300" cy="320" r="9"/><circle style="--i:15" cx="1300" cy="420" r="9"/>
					<circle style="--i:16" cx="1300" cy="520" r="9"/><circle style="--i:17" cx="1300" cy="620" r="9"/>
					<circle style="--i:18" cx="1300" cy="720" r="9"/>
				</g>
			</g>

			<!-- reflectores: haces que se mecen y cambian de color con cada movimiento -->
			<g class="sd-haces">
				<polygon class="sd-haz sd-haz-1" points="330,40 400,40 900,900 560,900" fill="url(#sd-haz-a)"/>
				<polygon class="sd-haz sd-haz-2" points="1200,40 1270,40 1040,900 700,900" fill="url(#sd-haz-b)"/>
				<polygon class="sd-haz sd-haz-3" points="780,0 820,0 1000,900 600,900" fill="url(#sd-haz-a)" opacity=".5"/>
			</g>
			<g class="sd-lamparas" fill="#2b2b3d" stroke="#111" stroke-width="4">
				<rect x="335" y="20" width="60" height="40" rx="10"/>
				<rect x="1205" y="20" width="60" height="40" rx="10"/>
				<rect x="770" y="0" width="60" height="30" rx="8"/>
			</g>

			<!-- guirnaldas de banderines -->
			<g class="sd-guirnalda">
				<path d="M240,150 Q420,240 640,170" fill="none" stroke="#ffe8a3" stroke-width="3"/>
				<path d="M960,170 Q1180,240 1360,150" fill="none" stroke="#ffe8a3" stroke-width="3"/>
				<g class="sd-banderin" style="--i:0"><path d="M290,172 l30,8 l-20,30 z" fill="#ff6b6b"/></g>
				<g class="sd-banderin" style="--i:1"><path d="M350,196 l30,6 l-18,32 z" fill="#ffd43b"/></g>
				<g class="sd-banderin" style="--i:2"><path d="M415,210 l30,2 l-14,32 z" fill="#51cf66"/></g>
				<g class="sd-banderin" style="--i:3"><path d="M480,212 l30,-2 l-12,32 z" fill="#339af0"/></g>
				<g class="sd-banderin" style="--i:4"><path d="M545,200 l28,-6 l-8,32 z" fill="#cc5de8"/></g>
				<g class="sd-banderin" style="--i:5"><path d="M1030,200 l28,6 l-20,28 z" fill="#ff922b"/></g>
				<g class="sd-banderin" style="--i:6"><path d="M1095,212 l30,2 l-16,32 z" fill="#ff6b6b"/></g>
				<g class="sd-banderin" style="--i:7"><path d="M1160,212 l30,-2 l-12,32 z" fill="#ffd43b"/></g>
				<g class="sd-banderin" style="--i:8"><path d="M1225,200 l30,-6 l-10,32 z" fill="#51cf66"/></g>
				<g class="sd-banderin" style="--i:9"><path d="M1290,178 l28,-10 l-6,32 z" fill="#339af0"/></g>
			</g>

			<!-- telones laterales recogidos y cenefa con flecos dorados -->
			<path class="sd-telon sd-telon-izq" d="M0,0 L250,0 Q215,260 175,430 Q150,560 205,900 L0,900 Z" fill="url(#sd-telon)"/>
			<path class="sd-telon sd-telon-der" d="M1600,0 L1350,0 Q1385,260 1425,430 Q1450,560 1395,900 L1600,900 Z" fill="url(#sd-telon)"/>
			<rect x="150" y="420" width="70" height="24" rx="12" fill="#f8c34a" stroke="#a86b00" stroke-width="4"/>
			<rect x="1380" y="420" width="70" height="24" rx="12" fill="#f8c34a" stroke="#a86b00" stroke-width="4"/>
			<path d="M0,0 L1600,0 L1600,70 Q1520,110 1440,70 Q1360,110 1280,70 Q1200,110 1120,70 Q1040,110 960,70 Q880,110 800,70 Q720,110 640,70 Q560,110 480,70 Q400,110 320,70 Q240,110 160,70 Q80,110 0,70 Z" fill="#b5122f"/>
			<path d="M0,70 Q80,110 160,70 Q240,110 320,70 Q400,110 480,70 Q560,110 640,70 Q720,110 800,70 Q880,110 960,70 Q1040,110 1120,70 Q1200,110 1280,70 Q1360,110 1440,70 Q1520,110 1600,70" fill="none" stroke="#f8c34a" stroke-width="8"/>

			<!-- estrellitas que titilan en la sala -->
			<use href="#sd-estrellita" class="sd-brillo" style="--i:0" x="420" y="330" fill="#fff"/>
			<use href="#sd-estrellita" class="sd-brillo" style="--i:1" x="1180" y="330" fill="#ffe066"/>
			<use href="#sd-estrellita" class="sd-brillo" style="--i:2" x="380" y="600" fill="#ffe066"/>
			<use href="#sd-estrellita" class="sd-brillo" style="--i:3" x="1220" y="620" fill="#fff"/>
			<use href="#sd-estrellita" class="sd-brillo" style="--i:4" x="800" y="130" fill="#fff"/>
		</svg>
	</div>

	<div id="pantalla-inicio" class="pantalla-inicio">
		<button type="button" id="btn-inicio-volver" class="inicio-volver" hidden>
			<img src="../../../assets/images/selector-aula/volver.png" alt="Volver">
		</button>
		<div class="inicio-mancha" aria-hidden="true"></div>
		<div class="inicio-contenido">
			<img class="inicio-icono" src="simon-dice.png" alt="" aria-hidden="true">
			<p class="inicio-kicker">¡Simón Dice Corporal!</p>
			<button type="button" id="btn-empecemos" class="btn-empecemos">
				<span class="btn-empecemos-anillo" aria-hidden="true"></span>
				<span class="btn-empecemos-anillo btn-empecemos-anillo-2" aria-hidden="true"></span>
				<span class="btn-empecemos-texto">¡Empecemos!</span>
			</button>
		</div>
	</div>

	<div id="intro3d-root" hidden>
		<div id="three-container"></div>
		<div id="phaser-container"></div>
		<button type="button" id="btn-omitir-intro3d" class="btn btn-warning" style="position:absolute;z-index:5;top:18px;left:18px;width:auto;padding:6pt 10pt;border-radius:8pt;font-size:24px;color:#000;">
			Omitir <i class="fa fa-forward" aria-hidden="true"></i>
		</button>
		<div id="intro3d-continuar" hidden>
			<div class="intro3d-continuar-card">
				<div class="intro3d-titulo-wrap">
					<span class="intro3d-ray intro3d-ray-l1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l3" aria-hidden="true"></span>
					<h2>¡Listo!</h2>
					<span class="intro3d-ray intro3d-ray-r1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r3" aria-hidden="true"></span>
				</div>
				<p>Toca el botón para empezar el juego</p>
				<div class="intro3d-btn-wrap">
					<span class="intro3d-ray intro3d-ray-bl1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-bl2" aria-hidden="true"></span>
					<button type="button" id="btn-continuar-intro3d">
						<span class="intro3d-btn-shine" aria-hidden="true"></span>
						<span class="intro3d-play" aria-hidden="true"></span>
						<span>CONTINUAR</span>
					</button>
					<span class="intro3d-ray intro3d-ray-br1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-br2" aria-hidden="true"></span>
				</div>
			</div>
		</div>
	</div>

	<div style="display: none; background-color: rgba(255, 255, 255, 0.664); width: 100%; height: 100%; position: fixed; z-index: 100;" id="fondo_blanco"></div>

	<div id="final" class="final" hidden>
		<div id="victoria">
			<img src="../../img/fondo.png" class="fondo" alt="">
			<div class="contenido">
				<img src="../../img/excelente.png" class="excelente" alt="¡Excelente!">
				<p class="texto-final" id="texto_final"></p>
				<img src="../../img/trofeo.png" class="trofeo" alt="Trofeo">
				<img src="../../img/zeus_normal.gif" class="personaje zeus" alt="Zeus">
				<img src="../../img/zoe_normal.gif" class="personaje zoe" alt="Zoe">
				<div class="destello destello-1"></div>
				<div class="destello destello-2"></div>
				<div class="destello destello-3"></div>
			</div>
			<img src="../../img/cortina_izq.png" class="cortina cortina-izq" alt="">
			<img src="../../img/cortina_der.png" class="cortina cortina-der" alt="">
			<div class="confeti" id="confeti"></div>
		</div>
		<div class="final-acciones" id="final-acciones">
			<p class="final-pregunta">¿Quieres jugar nuevamente?</p>
			<div class="final-botones">
				<button type="button" class="btn btn-success" onclick="window.location.reload(1)"><i class="fa-solid fa-play"></i> Sí</button>
				<button type="button" class="btn btn-danger" onclick="history.back()"><i class="fa-solid fa-home"></i> No</button>
			</div>
		</div>
	</div>

	<div id="principal">
		<!-- Zona superior: inicio, reiniciar, edad, título y (debajo) ronda, ítem y barra de progreso. -->
		<header class="hud-top">
			<div class="hud-nav">
				<button type="button" onclick="history.back()" class="btn-inicio" title="Volver al inicio"><i class="fa-solid fa-house" aria-hidden="true"></i> Inicio</button>
				<button type="button" onclick="location.reload()" class="btn btn-warning btn-round" title="Reiniciar"><i class="fa-solid fa-rotate"></i></button>
				<span class="hud-edad"><strong>3-4</strong> años</span>
			</div>
			<div class="hud-titulo">
				<h1 aria-label="¡Simón dice corporal!"><span style="--c:#ffd43b">¡</span><span style="--c:#ffd43b">S</span><span style="--c:#ffd43b">I</span><span style="--c:#ffd43b">M</span><span style="--c:#ffd43b">Ó</span><span style="--c:#ffd43b">N</span><span class="hud-espacio"> </span><span style="--c:#f783ac">D</span><span style="--c:#f783ac">I</span><span style="--c:#f783ac">C</span><span style="--c:#f783ac">E</span><span class="hud-espacio"> </span><span style="--c:#8ce99a">C</span><span style="--c:#8ce99a">O</span><span style="--c:#8ce99a">R</span><span style="--c:#8ce99a">P</span><span style="--c:#8ce99a">O</span><span style="--c:#8ce99a">R</span><span style="--c:#8ce99a">A</span><span style="--c:#8ce99a">L</span><span style="--c:#8ce99a">!</span></h1>
			</div>
		</header>

		<div id="progreso-box" class="progreso-box" aria-live="polite">
			<span id="progreso-ronda" class="progreso-pill progreso-pill-ronda">RONDA 1 DE 3</span>
			<span id="progreso-item" class="progreso-pill progreso-pill-item">ÍTEM 1 DE 4</span>
			<div id="progreso-grupos" class="progreso-grupos"></div>
			<div class="progreso-barra" role="progressbar" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" id="progreso-barra">
				<span id="progreso-relleno" class="progreso-relleno"></span>
				<strong id="progreso-num" class="progreso-num">0/12</strong>
			</div>
		</div>

		<!-- Zona central: la tarima con Zeus (3D) en el centro, Zoe a la izquierda y la marquesina (fase y los dos
		     movimientos de la secuencia) a la derecha. -->
		<main class="escena">
			<div id="escenario-zona" class="escenario-zona">
				<div class="tarima" id="tarima" aria-hidden="true">
					<div class="tarima-foco"></div>
					<div class="tarima-piso"></div>
					<div class="tarima-borde">
						<span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
						<span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span><span style="--i:7"></span>
						<span style="--i:8"></span><span style="--i:9"></span>
					</div>
				</div>

				<div id="zeus" class="pj-zeus" aria-hidden="true">
					<div class="zeus-pj">
						<img id="zeus-img" src="../../img/zeus_normal.gif" alt="">
					</div>
				</div>
				<div id="zeus-nube" class="nube nube-zeus" aria-live="polite" hidden><span id="zeus-nube-texto"></span></div>

				<div id="zoe" class="pj-zoe" aria-hidden="true">
					<div class="zoe-pj">
						<img id="zoe-img" src="../../img/zoe_normal.gif" alt="">
					</div>
				</div>
				<div id="zoe-nube" class="nube nube-zoe" aria-live="polite" hidden><span id="zoe-nube-texto"></span></div>

				<aside id="marquesina" class="marquesina" aria-live="polite">
					<div id="fase" class="fase fase-espera">
						<i class="fa-solid fa-eye fase-icono-observa" aria-hidden="true"></i>
						<i class="fa-solid fa-hand-pointer fase-icono-repite" aria-hidden="true"></i>
						<span id="fase-texto">¡SIMÓN DICE!</span>
					</div>
					<div class="secuencia" id="secuencia">
						<div class="ranura" data-n="1"><span class="ranura-num">1</span><img alt="" class="ranura-img"><span class="ranura-q">?</span></div>
						<i class="fa-solid fa-arrow-right secuencia-flecha" aria-hidden="true"></i>
						<div class="ranura" data-n="2"><span class="ranura-num">2</span><img alt="" class="ranura-img"><span class="ranura-q">?</span></div>
					</div>
					<div class="pasos" id="pasos" hidden>
						<span class="paso paso-observa"><i class="fa-solid fa-eye"></i> <span id="paso-observa-txt">1. OBSERVA</span></span>
						<span class="paso paso-repite"><i class="fa-solid fa-hand-pointer"></i> <span id="paso-repite-txt">2. REPITE</span></span>
					</div>
				</aside>

				<div id="escenario-cartel" class="escenario-cartel" hidden>
					<strong id="escenario-cartel-titulo"></strong>
					<span id="escenario-cartel-sub"></span>
				</div>
			</div>
		</main>

		<!-- Zona inferior: los TRES botones de acción visibles (ilustración, número y nombre). De los seis
		     movimientos solo se ven tres a la vez: script.js los vuelve a armar en cada ítem, con animación. -->
		<footer class="botonera" id="botonera"></footer>
	</div>

	<!-- Capa Phaser de efectos (estrellas, destellos, ondas, notas y confeti): delante de todo, sin recibir toques. -->
	<div id="efectos-phaser" class="efectos-phaser" aria-hidden="true"></div>

	<!-- Felicitación del final -->
	<div id="felicitacion" class="felicitacion" hidden>

			<div class="felicitacion-estrellas" aria-hidden="true">
				<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
			</div>
			<h2 id="felicitacion-titulo">¡ERES UN CAMPEÓN DE LA MEMORIA CORPORAL!</h2>
			<p id="felicitacion-sub"></p>
			<div id="felicitacion-dibujos" class="felicitacion-dibujos" aria-hidden="true"></div>
			<div class="felicitacion-botones">

				<button type="button" id="btn-continuar" class="btn-final btn-final-seguir"><span>CONTINUAR</span> <i class="fa-solid fa-arrow-right"></i></button>
			</div>
		</div>
	</div>

	<div id="comenzar-wrap" class="comenzar-wrap" hidden>
