<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<title>Secuencia de movimiento</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="stylesheet" href="/assets/css/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/css/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="/assets/css/fonts.css">
	<link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
	<script src="/assets/js/jquery-4.0.0.min.js"></script>
	<script src="/assets/js/sweetalert.js"></script>
	<link rel="stylesheet" href="style.css">
	<link rel="preload" as="image" href="img/manos_arriba.svg">
	<link rel="preload" as="image" href="img/manos_abajo.svg">
	<link rel="preload" as="image" href="img/brazos_abiertos.svg">
	<link rel="preload" as="image" href="img/brazos_cerrados.svg">
	<link rel="preload" as="image" href="img/manos_cabeza.svg">
	<link rel="preload" as="image" href="img/manos_barriga.svg">
	<link rel="preload" as="image" href="img/tocar_hombros.svg">
	<link rel="preload" as="image" href="img/manos_rodillas.svg">
	<link rel="preload" as="image" href="img/manos_frente.svg">
	<link rel="preload" as="image" href="img/tocar_cabeza.svg">
</head>
<body class="esperando-inicio">
	<div id="pantalla-inicio" class="pantalla-inicio">
		<div class="inicio-mancha" aria-hidden="true"></div>
		<div class="inicio-contenido">
			<p class="inicio-kicker">Secuencia de movimiento</p>
			<button type="button" id="btn-empecemos" class="btn-empecemos">
				<span class="btn-empecemos-anillo" aria-hidden="true"></span>
				<span class="btn-empecemos-anillo btn-empecemos-anillo-2" aria-hidden="true"></span>
				<span class="btn-empecemos-texto">¡Empecemos!</span>
			</button>
			<p class="inicio-ayuda">Toca para escuchar a Zoe y Zeus</p>
		</div>
	</div>

	<div style="display: none" class="overlay">
		<div id="personajes-container"></div>
		<div class="nube nube-centro">
			<img src="../../images/nube.png" id="nube_img" class="nube_img" alt="">
			<div class="nube-contenido">
				<p class="borde2" id="bienvenida"></p>
			</div>
		</div>
		<div style="z-index: 1003;position: absolute;top: 20pt;left: 20pt;">
			<button type="button" id="btnomitir" class="btn btn-warning"
				style="width: auto; padding: 4pt; border-radius: 8pt; font-size: 30px; color: black;">
				Omitir <i style="color: black" class="fa fa-forward" aria-hidden="true"></i>
			</button>
		</div>
	</div>

	<div style="display: none; background-color: rgba(255, 255, 255, 0.664); width: 100%; height: 100%; position: fixed; z-index: 100;" id="fondo_blanco"></div>

	<div style="display: none; text-align: center;" id="final" class="final">
		<h1 style="font-size: 25pt; padding-top: 326pt; padding-bottom: 0px;" class="borde2" id="texto_final"></h1>
		<hr>
		<div class="row">
			<div class="col-12" style="padding-bottom: 0pt; margin-top: 0px;">
				<h1 style="font-size: 25pt; padding: 12px;" class="borde2">¿Quieres jugar nuevamente?</h1>
			</div>
			<div class="col-3"></div>
			<div class="col-3 text-center">
				<button style="width: 80%; height: 50px !important; border-radius: 20pt; font-size: 23px;"
					onclick="window.location.reload(1)" class="btn btn-success">Si, jugar</button>
			</div>
			<div class="col-3 text-center">
				<button style="width: 80%; height: 50px !important; border-radius: 20pt; font-size: 23px;"
					onclick="history.back()" class="btn btn-danger">No, salir</button>
			</div>
			<div class="col-3"></div>
		</div>
	</div>

	<div id="principal">
		<div class="hud-top">
			<div class="hud-nav">
				<div id="progreso" class="hud-progreso" hidden></div>
				<button type="button" onclick="location.reload()" class="btn btn-warning btn-round"
					title="Reiniciar"><i class="fa-solid fa-rotate"></i></button>
				<button type="button" onclick="history.back()" class="btn btn-danger btn-round"
					title="Salir"><i class="fa-solid fa-arrow-left"></i></button>
			</div>
		</div>

		<div class="enunciado-wrap">
			<h1 class="borde" id="enunciado">Observa la secuencia y elige qué sigue</h1>
		</div>

		<div class="escenario" id="escenario">
			<div class="escena-wrap" id="escena-wrap">
				<div id="riel" class="riel" aria-live="polite"></div>
				<div id="opciones" class="opciones" hidden></div>
			</div>
		</div>
	</div>

	<div id="menu-vol" class="menu-acc">
		<button type="button" id="btn-menu-vol" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-vol-panel" title="Volumen de fondo">
			<i class="fa-solid fa-volume-high"></i>
		</button>
		<div id="menu-vol-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Volumen de fondo</strong>
				<button type="button" id="btn-cerrar-vol" class="menu-acc-cerrar" aria-label="Cerrar">×</button>
			</div>
			<label class="menu-acc-op menu-acc-rango">
				<span>Volumen <strong id="vol-val">20</strong></span>
				<input type="range" id="rango-volumen" min="0" max="100" step="1" value="20">
			</label>
		</div>
	</div>

	<script src="../../texto_voz.js"></script>
	<script src="script.js"></script>
</body>
</html>
