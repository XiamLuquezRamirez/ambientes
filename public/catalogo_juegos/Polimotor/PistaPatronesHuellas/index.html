<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<title>¡La Pista de Patrones de Huellas y Ritmo!</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="stylesheet" href="../../../assets/css/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="../../../assets/css/fontawesome/css/all.min.css">
	<link rel="stylesheet" href="../../../assets/css/fonts.css">
	<link rel="stylesheet" href="../../../assets/css/sweetalert2.min.css">
	<script src="../../../assets/js/jquery-4.0.0.min.js"></script>
	<script src="../../../assets/js/sweetalert.js"></script>
	<link rel="stylesheet" href="style.css?v=20261114e">
	<link rel="stylesheet" href="../comun/inicio-fondo.css?v=20261030d">
	<link rel="stylesheet" href="../comun/interfaz.css?v=20261022o">
	<script src="../comun/inicio-fondo.js?v=20261030d"></script>
	<link rel="stylesheet" href="../../final/final.css">
	<link rel="stylesheet" href="../../intro3d/css/intro.css">
	<link rel="stylesheet" href="../../tutorial/tutorial.css?v=20261005a">
</head>
<body class="esperando-inicio">
	<!-- El aula de Polimotor simulada en 3D (aula-pista.js, sin el modelo pesado de la intro), con la pista de huellas, el
	     carril, la meta y Zeus dentro de la misma escena y con la misma cámara, así la perspectiva cuadra. -->
	<div id="aula-3d" class="aula-3d" aria-hidden="true"></div>

	<div id="pantalla-inicio" class="pantalla-inicio">
		<button type="button" id="btn-inicio-volver" class="inicio-volver" hidden>
			<img src="../../../assets/images/selector-aula/volver.png" alt="Volver">
		</button>
		<div class="inicio-mancha" aria-hidden="true"></div>
		<div class="inicio-contenido">
			<img class="inicio-icono" src="pista-huellas.svg" alt="" aria-hidden="true">
			<p class="inicio-kicker">¡La Pista de Patrones de Huellas y Ritmo!</p>
			<button type="button" id="btn-empecemos" class="btn-empecemos">
				<span class="btn-empecemos-anillo" aria-hidden="true"></span>
				<span class="btn-empecemos-anillo btn-empecemos-anillo-2" aria-hidden="true"></span>
				<span class="btn-empecemos-texto">¡Empecemos!</span>
			</button>
		</div>
	</div>

	<div id="intro3d-root" hidden>
		<div id="three-container"></div>
		<div id="phaser-container"></div>
		<button type="button" id="btn-omitir-intro3d" class="btn btn-warning" style="position:absolute;z-index:5;top:18px;left:18px;width:auto;padding:6pt 10pt;border-radius:8pt;font-size:24px;color:#000;">
			Omitir <i class="fa fa-forward" aria-hidden="true"></i>
		</button>
		<div id="intro3d-continuar" hidden>
			<div class="intro3d-continuar-card">
				<div class="intro3d-titulo-wrap">
					<span class="intro3d-ray intro3d-ray-l1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-l3" aria-hidden="true"></span>
					<h2>¡Listo!</h2>
					<span class="intro3d-ray intro3d-ray-r1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r2" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-r3" aria-hidden="true"></span>
				</div>
				<p>Toca el botón para empezar el juego</p>
				<div class="intro3d-btn-wrap">
					<span class="intro3d-ray intro3d-ray-bl1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-bl2" aria-hidden="true"></span>
					<button type="button" id="btn-continuar-intro3d">
						<span class="intro3d-btn-shine" aria-hidden="true"></span>
						<span class="intro3d-play" aria-hidden="true"></span>
						<span>CONTINUAR</span>
					</button>
					<span class="intro3d-ray intro3d-ray-br1" aria-hidden="true"></span>
					<span class="intro3d-ray intro3d-ray-br2" aria-hidden="true"></span>
				</div>
			</div>
		</div>
	</div>

	<div style="display: none; background-color: rgba(255, 255, 255, 0.664); width: 100%; height: 100%; position: fixed; z-index: 100;" id="fondo_blanco"></div>

	<div id="final" class="final" hidden>
		<div id="victoria">
			<img src="../../img/fondo.png" class="fondo" alt="">
			<div class="contenido">
				<img src="../../img/excelente.png" class="excelente" alt="¡Excelente!">
				<p class="texto-final" id="texto_final"></p>
				<img src="../../img/trofeo.png" class="trofeo" alt="Trofeo">
				<img src="../../img/zeus_normal.gif" class="personaje zeus" alt="Zeus">
				<img src="../../img/zoe_normal.gif" class="personaje zoe" alt="Zoe">
				<div class="destello destello-1"></div>
				<div class="destello destello-2"></div>
				<div class="destello destello-3"></div>
			</div>
			<img src="../../img/cortina_izq.png" class="cortina cortina-izq" alt="">
			<img src="../../img/cortina_der.png" class="cortina cortina-der" alt="">
			<div class="confeti" id="confeti"></div>
		</div>
		<div class="final-acciones" id="final-acciones">
			<p class="final-pregunta">¿Quieres jugar nuevamente?</p>
			<div class="final-botones">
				<button type="button" class="btn btn-success" onclick="window.location.reload(1)"><i class="fa-solid fa-play"></i> Sí</button>
				<button type="button" class="btn btn-danger" onclick="history.back()"><i class="fa-solid fa-home"></i> No</button>
			</div>
		</div>
	</div>

	<div id="principal">
		<!-- Zona superior: título a la izquierda; Inicio y reiniciar a la derecha. El centro queda libre para el letrero del gimnasio. -->
		<!-- Cabecera en una sola fila: ronda y estrellas a la izquierda, los cajones del patrón centrados arriba e
		     Inicio y reiniciar a la derecha. Sin título, sin barra 0/9 y sin botón de fase (pedido del usuario): la fase
		     se nota por el color del marco de los cajones (dorado = mira, verde = repite). -->
		<header class="hud-top">
			<div id="progreso-box" class="progreso-box" aria-live="polite">
				<span id="progreso-ronda" class="progreso-pill progreso-pill-ronda">RONDA 1 DE 3</span>
				<span id="progreso-estrellas" class="progreso-estrellas" role="img" aria-label="0 de 3 ítems">
					<i class="fa-solid fa-star progreso-estrella" aria-hidden="true"></i>
					<i class="fa-solid fa-star progreso-estrella" aria-hidden="true"></i>
					<i class="fa-solid fa-star progreso-estrella" aria-hidden="true"></i>
				</span>
				<div id="progreso-grupos" class="progreso-grupos" hidden></div>
			</div>
			<aside id="marquesina" class="marquesina" aria-live="polite">
				<!-- la fase sigue existiendo para el lector de pantalla y la lógica, pero no se ve -->
				<div id="fase" class="fase fase-espera visualmente-oculto"><span id="fase-texto">¡A LA PISTA!</span></div>
				<div class="secuencia n-4" id="secuencia" data-n="4">
					<div class="ranura" data-n="1"><span class="ranura-num">1</span><img alt="" class="ranura-img"><span class="ranura-q">?</span></div>
					<i class="fa-solid fa-arrow-right secuencia-flecha" aria-hidden="true"></i>
					<div class="ranura" data-n="2"><span class="ranura-num">2</span><img alt="" class="ranura-img"><span class="ranura-q">?</span></div>
					<i class="fa-solid fa-arrow-right secuencia-flecha" aria-hidden="true"></i>
					<div class="ranura" data-n="3"><span class="ranura-num">3</span><img alt="" class="ranura-img"><span class="ranura-q">?</span></div>
					<i class="fa-solid fa-arrow-right secuencia-flecha" aria-hidden="true"></i>
					<div class="ranura" data-n="4"><span class="ranura-num">4</span><img alt="" class="ranura-img"><span class="ranura-q">?</span></div>
				</div>
			</aside>
			<div class="hud-nav hud-nav-der">
				<button type="button" onclick="history.back()" class="btn-inicio" title="Volver al menú"><i class="fa-solid fa-house" aria-hidden="true"></i> <span>Inicio</span></button>
				<button type="button" onclick="location.reload()" class="btn btn-warning btn-round btn-recargar" title="Reiniciar"><i class="fa-solid fa-rotate"></i></button>
			</div>
		</header>

		<!-- Zona central: la pista 3D. -->
		<main class="escena">
			<div id="escenario-zona" class="escenario-zona">

				<!-- Botones de las plataformas para teclado y lectores de pantalla (la pista se ve y se toca en 3D). -->
				<div id="pista" class="pista" role="group" aria-label="Plataformas de huellas"></div>

				<div id="escenario-cartel" class="escenario-cartel" hidden>
					<strong id="escenario-cartel-titulo"></strong>
					<span id="escenario-cartel-sub"></span>
				</div>
			</div>
		</main>
	</div>

	<div id="zeus-nube" class="nube nube-zeus" aria-live="polite" hidden><span id="zeus-nube-texto"></span></div>

	<!-- Flechas de luz entre plataformas (solo mientras la pista muestra la secuencia). -->
	<svg id="flechas" class="flechas" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<marker id="flecha-punta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
				<path d="M0,0 L10,5 L0,10 z" fill="#fff8d6"/>
			</marker>
		</defs>
	</svg>

	<!-- Capa Phaser de efectos (ondas, estrellas, chispas, serpentinas y confeti): delante de todo, sin toques. -->
	<div id="efectos-phaser" class="efectos-phaser" aria-hidden="true"></div>

	<!-- Felicitación del final -->
	<div id="felicitacion" class="felicitacion" hidden>
		<div class="felicitacion-tarjeta" role="dialog" aria-labelledby="felicitacion-titulo">
			<div class="felicitacion-estrellas" aria-hidden="true">
				<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
			</div>
			<h2 id="felicitacion-titulo">¡ESPECTACULAR!</h2>
			<p id="felicitacion-sub"></p>
			<div id="felicitacion-dibujos" class="felicitacion-dibujos" aria-hidden="true"></div>
			<div class="felicitacion-botones">
				<button type="button" id="btn-otra-vez" class="btn-final btn-final-otra"><i class="fa-solid fa-rotate-right"></i> <span>VOLVER A JUGAR</span></button>
				<button type="button" id="btn-menu" class="btn-final btn-final-menu"><i class="fa-solid fa-house"></i> <span>MENÚ</span></button>
				<button type="button" id="btn-continuar" class="btn-final btn-final-seguir"><span>CONTINUAR</span> <i class="fa-solid fa-arrow-right"></i></button>
			</div>
		</div>
	</div>

	<div id="menu-acc" class="menu-acc">
		<button type="button" id="btn-menu-acc" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-acc-panel" title="Accesibilidad">
			<i class="fa-solid fa-universal-access"></i>
		</button>
		<div id="menu-acc-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Accesibilidad</strong>
				<button type="button" id="btn-cerrar-acc" class="menu-acc-cerrar" aria-label="Cerrar">&times;</button>
			</div>
			<div id="menu-acc-ops" class="menu-acc-ops"></div>
		</div>
	</div>

	<div id="menu-vol" class="menu-acc">
		<button type="button" id="btn-menu-vol" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-vol-panel" title="Sonido">
			<i class="fa-solid fa-volume-high"></i>
		</button>
		<div id="menu-vol-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Sonido</strong>
				<button type="button" id="btn-cerrar-vol" class="menu-acc-cerrar" aria-label="Cerrar">×</button>
			</div>
			<label class="menu-acc-op">
				<input type="checkbox" id="chk-voces" checked> Voces
			</label>
			<label class="menu-acc-op">
				<input type="checkbox" id="chk-efectos" checked> Efectos
			</label>
			<label class="menu-acc-op menu-acc-rango">
				<span>Música de fondo <strong id="vol-val">20</strong></span>
				<input type="range" id="rango-volumen" min="0" max="100" step="1" value="20">
			</label>
		</div>
	</div>

	<script src="../../texto_voz.js"></script>
	<script src="../../shared/edad-nivel.js"></script>
	<script src="../../../assets/vendor/phaser/phaser.min.js"></script>
	<script src="../../intro3d/js/config.js?v=20261007a"></script>
	<script src="../../intro3d/js/ambientes-tema.js?v=20261105a"></script>
	<script type="importmap">
	{
	  "imports": {
	    "three": "../../../assets/vendor/three/three.module.js",
	    "three/addons/": "../../../assets/vendor/three/addons/"
	  }
	}
	</script>
	<script type="module" src="../../intro3d/js/three-scene.js?v=20261105a"></script>
	<script type="module" src="../../intro3d/js/final-scene.js?v=20261105a"></script>
	<script src="../../tutorial/tutorial.js?v=20261019c"></script>
	<script src="../../intro3d/js/intro.js?v=20261028p4"></script>
	<script src="../../final/final.js"></script>
	<script src="../../shared/aplicar-perfil-juego.js?v=20261013a"></script>
	<script src="../../shared/pin-accesibilidad.js?v=20261019c"></script>
	<script src="../../../assets/vendor/gsap/gsap.min.js"></script>
	<script src="../../../assets/vendor/howler/howler.core.min.js"></script>
	<script src="../../shared/pednia-audio.js?v=20261028t"></script>
	<script src="../../shared/pednia-fx.js?v=20261107d"></script>
	<script src="reglas.js?v=20261114b"></script>
	<script src="iconos.js?v=20261114a"></script>
	<script src="sonidos.js?v=20261114a"></script>
	<script src="escenario-phaser.js?v=20261114a"></script>
	<script src="demo.js?v=20261114a"></script>
	<script src="script.js?v=20261114d"></script>
	<script type="module" src="aula-pista.js?v=20261114j"></script>
</body>
</html>
