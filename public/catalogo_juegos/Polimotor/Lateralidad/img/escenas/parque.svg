<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f7"/>
      <stop offset="1" stop-color="#e3f5ff"/>
    </linearGradient>
    <linearGradient id="pasto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad672"/>
      <stop offset="1" stop-color="#62ad42"/>
    </linearGradient>
    <g id="nube" fill="#fff">
      <ellipse cx="0" cy="0" rx="70" ry="30"/>
      <ellipse cx="-52" cy="10" rx="46" ry="24"/>
      <ellipse cx="58" cy="12" rx="50" ry="22"/>
      <ellipse cx="8" cy="-20" rx="42" ry="28"/>
    </g>
    <g id="pino">
      <rect x="-12" y="0" width="24" height="70" fill="#7a4e26"/>
      <path d="M0 -190 L-80 10 H80 Z" fill="#3f8f3a"/>
      <path d="M0 -230 L-60 -70 H60 Z" fill="#4ea548"/>
    </g>
    <g id="copa">
      <rect x="-16" y="0" width="32" height="140" rx="8" fill="#8b5a2b"/>
      <circle cx="0" cy="-40" r="90" fill="#5aae46"/>
      <circle cx="-70" cy="10" r="60" fill="#66bb50"/>
      <circle cx="70" cy="0" r="66" fill="#66bb50"/>
    </g>
    <g id="arbusto">
      <circle cx="-50" cy="0" r="44" fill="#4f9d3a"/>
      <circle cx="0" cy="-16" r="54" fill="#58aa41"/>
      <circle cx="54" cy="2" r="42" fill="#4f9d3a"/>
      <circle cx="-20" cy="-30" r="7" fill="#ff8fab"/><circle cx="30" cy="-10" r="7" fill="#fff"/><circle cx="-56" cy="-6" r="7" fill="#ffd43b"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#cielo)"/>
  <circle cx="1420" cy="120" r="60" fill="#ffe36e"/>
  <use href="#nube" x="300" y="130"/>
  <use href="#nube" x="900" y="100" opacity="0.85"/>
  <use href="#nube" x="1150" y="240" opacity="0.6"/>
  <path d="M0 540 Q300 470 600 520 T1200 510 T1600 500 V900 H0 Z" fill="#b5e08f"/>
  <use href="#pino" x="260" y="500"/>
  <use href="#pino" x="380" y="520"/>
  <use href="#pino" x="1260" y="500"/>
  <use href="#copa" x="1420" y="460"/>
  <use href="#copa" x="120" y="460"/>
  <path d="M0 600 Q400 570 800 600 T1600 590 V900 H0 Z" fill="url(#pasto)"/>
  <!-- camino de tierra -->
  <path d="M560 900 Q700 720 800 610 Q900 720 1040 900 Z" fill="#e8d3a7"/>
  <path d="M640 900 Q740 740 800 640 Q860 740 960 900" fill="none" stroke="#d6bd8a" stroke-width="6" stroke-dasharray="4 26" stroke-linecap="round"/>
  <use href="#arbusto" x="150" y="660"/>
  <use href="#arbusto" x="1460" y="670"/>
  <!-- farolas -->
  <g fill="#3d4a5c">
    <rect x="455" y="470" width="10" height="180" rx="4"/>
    <rect x="1135" y="470" width="10" height="180" rx="4"/>
  </g>
  <g fill="#fff3bf" stroke="#3d4a5c" stroke-width="5">
    <rect x="440" y="440" width="40" height="40" rx="8"/>
    <rect x="1120" y="440" width="40" height="40" rx="8"/>
  </g>
</svg>
