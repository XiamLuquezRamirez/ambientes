  <use href="#arbusto" transform="translate(620 438) scale(0.7)"/>
  <use href="#arbusto" transform="translate(1290 440) scale(0.6)"/>
  <use href="#arbusto" transform="translate(80 470) scale(0.9)"/>
  <use href="#arbusto" transform="translate(1860 474) scale(0.95)"/>

  <!-- Banca del parque -->
  <g transform="translate(1720 760)">
    <rect x="-150" y="-70" width="300" height="20" rx="8" fill="#c97b3d"/>
    <rect x="-150" y="-42" width="300" height="20" rx="8" fill="#c97b3d"/>
    <rect x="-160" y="0" width="320" height="22" rx="8" fill="#b5692f"/>
    <rect x="-140" y="-80" width="14" height="140" rx="5" fill="#5d4037"/>
