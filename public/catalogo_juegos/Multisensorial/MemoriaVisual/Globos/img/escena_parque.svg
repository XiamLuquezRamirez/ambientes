    <path d="M1560 446 V392 l12 -14 l12 14 V446 Z"/>
    <path d="M1660 446 V392 l12 -14 l12 14 V446 Z"/>
    <path d="M1760 446 V392 l12 -14 l12 14 V446 Z"/>
    <path d="M1860 446 V392 l12 -14 l12 14 V446 Z"/>
  </g>

  <!-- Arbol izquierdo -->
