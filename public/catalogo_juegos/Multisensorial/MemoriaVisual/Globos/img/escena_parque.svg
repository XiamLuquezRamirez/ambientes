    <circle cx="1724" cy="404" r="80" fill="#3d9a41"/>
    <circle cx="1626" cy="412" r="84" fill="#43a047"/>
    <circle cx="1656" cy="186" r="40" fill="#6cc96f" opacity="0.7"/>
