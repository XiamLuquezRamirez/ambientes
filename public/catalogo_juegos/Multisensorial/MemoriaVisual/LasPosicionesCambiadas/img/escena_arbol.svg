<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#e4f5ff"/>
    </linearGradient>
    <linearGradient id="pasto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bd96f"/>
      <stop offset="1" stop-color="#5fae3e"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff8c4" stop-opacity="0"/>
    </radialGradient>
    <g id="nube">
      <ellipse cx="0" cy="0" rx="90" ry="34" fill="#fff"/>
      <ellipse cx="-48" cy="-14" rx="46" ry="34" fill="#fff"/>
      <ellipse cx="34" cy="-26" rx="56" ry="42" fill="#fff"/>
    </g>
    <g id="arbusto">
      <circle cx="-48" cy="0" r="46" fill="#4caf50"/>
      <circle cx="10" cy="-22" r="58" fill="#5cbf5f"/>
      <circle cx="66" cy="2" r="44" fill="#43a047"/>
      <rect x="-94" y="0" width="204" height="40" fill="#43a047"/>
    </g>
    <g id="mata">
      <path d="M0 0 q-6 -22 -16 -30 M0 0 q2 -26 0 -38 M0 0 q8 -20 18 -28" stroke="#4e9a34" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
    <g id="hojita">
      <path d="M0 -14 C12 -10 14 6 0 14 C-14 6 -12 -10 0 -14 Z"/>
      <path d="M0 -12 V12" stroke="#000" stroke-opacity="0.2" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#cielo)"/>
  <circle cx="1720" cy="120" r="260" fill="url(#brillo)"/>

  <use href="#nube" transform="translate(1120 120) scale(0.8)" opacity="0.85"/>
  <use href="#nube" transform="translate(1560 260) scale(0.65)" opacity="0.9"/>

  <path d="M0 400 Q260 300 560 380 T1120 360 T1600 340 T1920 380 V460 H0 Z" fill="#b6e39a"/>
  <path d="M0 430 Q340 360 720 420 T1400 400 T1920 420 V470 H0 Z" fill="#a3d982"/>

  <rect y="432" width="1920" height="648" fill="url(#pasto)"/>
  <path d="M0 432 Q480 452 960 440 T1920 436 V470 H0 Z" fill="#8fd062" opacity="0.7"/>

  <!-- Arbol grande del parque: de aqui cae la hoja -->
  <g>
    <path d="M330 700 C342 600 330 470 312 330 L410 330 C392 470 384 600 404 700 Z" fill="#8d5b3d"/>
    <path d="M360 470 C320 430 270 418 220 400" stroke="#8d5b3d" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M370 430 C420 380 500 360 560 340" stroke="#8d5b3d" stroke-width="20" stroke-linecap="round" fill="none"/>
    <circle cx="200" cy="300" r="170" fill="#3d9a41"/>
    <circle cx="420" cy="250" r="190" fill="#46a84a"/>
    <circle cx="320" cy="120" r="170" fill="#52b556"/>
    <circle cx="610" cy="200" r="150" fill="#43a047"/>
    <circle cx="120" cy="140" r="130" fill="#4caf50"/>
    <circle cx="560" cy="330" r="110" fill="#3a8f3e"/>
    <circle cx="160" cy="430" r="100" fill="#3a8f3e"/>
    <circle cx="390" cy="410" r="110" fill="#43a047"/>
    <circle cx="470" cy="110" r="60" fill="#6cc96f" opacity="0.7"/>
    <circle cx="250" cy="220" r="50" fill="#6cc96f" opacity="0.6"/>
    <ellipse cx="370" cy="706" rx="190" ry="24" fill="#3f8a2b" opacity="0.35"/>
  </g>

  <!-- Arbol pequeno al fondo, a la derecha -->
  <g>
    <rect x="1694" y="380" width="26" height="90" rx="6" fill="#7b4f35"/>
    <circle cx="1680" cy="350" r="60" fill="#46a84a"/>
    <circle cx="1740" cy="340" r="64" fill="#3d9a41"/>
    <circle cx="1708" cy="290" r="62" fill="#52b556"/>
  </g>

  <use href="#arbusto" transform="translate(1290 440) scale(0.6)"/>
  <use href="#arbusto" transform="translate(1860 474) scale(0.95)"/>
  <use href="#arbusto" transform="translate(900 436) scale(0.5)"/>

  <!-- Hojitas caidas en el pasto -->
  <g fill="#8bc34a">
    <use href="#hojita" transform="translate(560 760) rotate(30)"/>
    <use href="#hojita" transform="translate(180 820) rotate(-40)"/>
  </g>
  <g fill="#ffb74d">
    <use href="#hojita" transform="translate(640 860) rotate(70) scale(1.2)"/>
    <use href="#hojita" transform="translate(1540 820) rotate(-20)"/>
  </g>
  <g fill="#aed581">
    <use href="#hojita" transform="translate(300 960) rotate(10) scale(1.3)"/>
    <use href="#hojita" transform="translate(1700 980) rotate(55) scale(1.2)"/>
  </g>

  <use href="#mata" transform="translate(140 700)"/>
  <use href="#mata" transform="translate(1480 860) scale(1.2)"/>
  <use href="#mata" transform="translate(1820 960) scale(1.4)"/>
  <use href="#mata" transform="translate(1380 690)"/>
  <use href="#mata" transform="translate(760 1010) scale(1.3)"/>
  <use href="#mata" transform="translate(1180 1030) scale(1.3)"/>
</svg>
