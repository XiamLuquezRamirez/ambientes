<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <radialGradient id="lupa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fffde7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="480" fill="url(#g)"/>
  <rect x="0" y="400" width="800" height="80" fill="#212121"/>
  <!-- linternas / focos -->
  <circle cx="100" cy="200" r="70" fill="url(#lupa)"/>
  <circle cx="700" cy="160" r="80" fill="url(#lupa)"/>
  <!-- placas doradas -->
  <rect x="40" y="300" width="70" height="28" rx="4" fill="#ffd54f" opacity=".25"/>
  <rect x="690" y="290" width="70" height="28" rx="4" fill="#ffd54f" opacity=".25"/>
  <!-- lupa sutil -->
  <circle cx="720" cy="340" r="28" fill="none" stroke="#80d8ff" stroke-width="4" opacity=".3"/>
  <line x1="740" y1="360" x2="770" y2="390" stroke="#80d8ff" stroke-width="4" opacity=".3"/>
</svg>
