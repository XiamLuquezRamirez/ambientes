<body class="esperando-inicio tema-constelacion">
	<div id="pantalla-inicio" class="pantalla-inicio">
		<div class="inicio-mancha" aria-hidden="true"></div>
		<div class="inicio-escena" aria-hidden="true">
			<i class="fa-solid fa-star inicio-nota n1"></i>
			<i class="fa-solid fa-rocket inicio-nota n2"></i>
			<i class="fa-solid fa-satellite inicio-nota n3"></i>
			<img class="inicio-pj inicio-zoe" src="../../../img/zoe_normal.gif" alt="" draggable="false">
			<img class="inicio-pj inicio-zeus" src="../../../img/zeus_normal.gif" alt="" draggable="false">
		</div>
		<div class="inicio-contenido">
			<img class="inicio-icono" src="img/constelacion_icono.svg" alt="" aria-hidden="true">
			<p class="inicio-kicker">Une los Puntos de la Constelación</p>
			<button type="button" id="btn-empecemos" class="btn-empecemos" aria-label="Empezar">
				<span class="btn-empecemos-anillo" aria-hidden="true"></span>
				<span class="btn-empecemos-anillo btn-empecemos-anillo-2" aria-hidden="true"></span>
				<span class="btn-empecemos-texto">¡Empecemos!</span>
			</button>
		</div>
	</div>

	<div id="intro3d-root" hidden>
		<div id="three-container"></div>
		<div id="phaser-container"></div>
		<button type="button" id="btn-omitir-intro3d" class="btn btn-warning" style="position:absolute;z-index:5;top:18px;left:18px;width:auto;padding:6pt 10pt;border-radius:8pt;font-size:24px;color:#000;" aria-label="Omitir">
			Omitir <i class="fa fa-forward" aria-hidden="true"></i>
		</button>
		<div id="intro3d-continuar" hidden>
			<div class="intro3d-continuar-card">
				<p>Toca para empezar</p>
				<button type="button" id="btn-continuar-intro3d" aria-label="Continuar">
					<i class="fa-solid fa-play" aria-hidden="true"></i>
				</button>
			</div>
		</div>
	</div>

	<div id="fondo_blanco" hidden></div>

	<div id="final" class="final" hidden>
		<div id="victoria">
			<img src="../../../img/fondo.png" class="fondo" alt="">
			<div class="contenido">
				<img src="../../../img/excelente.png" class="excelente" alt="">
				<p class="texto-final" id="texto_final"></p>
				<img src="img/insignia_constelacion.svg" class="trofeo" alt="">
				<img src="../../../img/zeus_normal.gif" class="personaje zeus" alt="">
				<img src="../../../img/zoe_normal.gif" class="personaje zoe" alt="">
				<div class="destello destello-1"></div>
				<div class="destello destello-2"></div>
				<div class="destello destello-3"></div>
			</div>
			<img src="../../../img/cortina_izq.png" class="cortina cortina-izq" alt="">
			<img src="../../../img/cortina_der.png" class="cortina cortina-der" alt="">
			<div class="confeti" id="confeti"></div>
		</div>
		<div class="final-acciones" id="final-acciones">
			<div class="final-botones">
				<button type="button" class="btn btn-success btn-solo-icono" onclick="window.location.reload()" aria-label="Jugar de nuevo"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
				<button type="button" class="btn btn-danger btn-solo-icono" onclick="history.back()" aria-label="Salir"><i class="fa-solid fa-home" aria-hidden="true"></i></button>
			</div>
		</div>
	</div>

	<div id="principal">
		<div id="phaser-juego" class="phaser-juego"></div>

		<div class="capa-ui">
			<div class="barra-superior">
				<div class="barra-botones-izq">
					<button type="button" onclick="location.reload()" class="btn-circular-cons btn-mini" title="Reiniciar" aria-label="Reiniciar"><i class="fa-solid fa-rotate"></i></button>
					<button type="button" onclick="history.back()" class="btn-circular-cons btn-mini" title="Salir" aria-label="Salir"><i class="fa-solid fa-arrow-left"></i></button>
					<button type="button" id="btn-volumen" class="btn-circular-cons" aria-label="Volumen">
						<i class="fa-solid fa-volume-high"></i>
						<span class="lbl-circular">VOLUMEN</span>
					</button>
					<button type="button" id="btn-pregunta" class="btn-circular-cons" aria-label="Repetir instrucción">
						<i class="fa-solid fa-question"></i>
						<span class="lbl-circular">PISTA</span>
					</button>
					<button type="button" id="btn-mapa" class="btn-circular-cons" aria-label="Mapa estelar" hidden>
						<i class="fa-solid fa-map"></i>
						<span class="lbl-circular">MAPA</span>
					</button>
				</div>

				<div class="centro-barra">
					<div class="banner-nivel" id="titulo-nivel">NIVEL 1: LA SEÑAL PERDIDA</div>
					<div class="medallas-niveles" id="medallas-niveles" aria-label="Progreso de niveles"></div>
				</div>

				<div class="progreso-estrella" aria-label="Progreso del nivel">
					<i class="fa-solid fa-star estrella-oro"></i>
					<div class="barra-progreso"><div class="barra-progreso-rel" id="barra-progreso-rel"></div></div>
					<span class="contador-estrellas" id="contador-estrellas">0/0</span>
					<span class="pista-numero" id="pista-numero">Busca el 1</span>
				</div>
			</div>

			<div class="personaje-cons pj-zoe" id="pj-zoe">
				<img src="../../../img/zoe_normal.gif" alt="" draggable="false">
				<div class="bocadillo bocadillo-zoe">
					<span class="bocadillo-nombre">Zoe</span>
					<p id="bocadillo-zoe-texto">¡Vamos a dibujar constelaciones en el cielo!</p>
				</div>
			</div>

			<div class="personaje-cons pj-zeus" id="pj-zeus">
				<img src="../../../img/zeus_normal.gif" alt="" draggable="false">
				<div class="bocadillo bocadillo-zeus">
					<span class="bocadillo-nombre">Zeus</span>
					<p id="bocadillo-zeus-texto">Une las estrellas en orden, del 1 al final.</p>
				</div>
			</div>
		</div>
	</div>

	<div id="capa-efectos" class="capa-efectos" aria-hidden="true"></div>

			<i class="fa-solid fa-universal-access"></i>
		</button>

			<div class="menu-acc-cab">
				<strong>Accesibilidad</strong>
				<button type="button" id="btn-cerrar-acc" class="menu-acc-cerrar" aria-label="Cerrar">&times;</button>
			</div>
			<div id="menu-acc-ops" class="menu-acc-ops"></div>
		</div>
	</div>

	<div id="menu-vol" class="menu-acc">
		<button type="button" id="btn-menu-vol" class="menu-acc-fab" aria-expanded="false" aria-controls="menu-vol-panel" title="Volumen de fondo">
			<i class="fa-solid fa-volume-high"></i>
		</button>
		<div id="menu-vol-panel" class="menu-acc-panel" hidden>
			<div class="menu-acc-cab">
				<strong>Volumen de fondo</strong>
				<button type="button" id="btn-cerrar-vol" class="menu-acc-cerrar" aria-label="Cerrar">&times;</button>
			</div>
			<label class="menu-acc-op menu-acc-rango">
				<span>Volumen <strong id="vol-val">20</strong></span>
				<input type="range" id="rango-volumen" min="0" max="100" step="1" value="20">
			</label>
		</div>
