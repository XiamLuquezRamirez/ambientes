<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Video</title>
  <base href="/proyecto/">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="captura.css">
  <link rel="stylesheet" href="video.css">
</head>
<body>
<div class="contenedor">
  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="foto.html">Foto</a>
    <a class="activo" href="video.html">Video</a>
    <a href="audio.html">Audio</a>
  </nav>
  <div class="card">
    <div class="titulo">🎥 Grabar video</div>
    <div class="subtitulo" id="subtituloVideo">Presione para grabar un video con la cámara.</div>
    <button id="btnGrabarVideo" class="btn-video">🎥 Grabar video</button>
    <input id="inputVideo" type="file" accept="video/*" capture="environment" hidden>
  </div>
</div>
<div id="modalPreview" class="modal">
  <div class="modal-contenido">
    <div class="modal-titulo">🎥 Vista previa</div>
    <video id="videoPreview" class="modal-media" controls playsinline webkit-playsinline></video>
    <div id="infoVideo" class="info"></div>
    <button id="btnGuardar" class="btn-guardar">💾 Guardar video</button>
    <button id="btnCerrarPreview" class="btn-cancelar">🗑️ Descartar y grabar otro</button>
  </div>
</div>
<script src="video.js"></script>
</body>
</html>
